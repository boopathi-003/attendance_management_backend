spring.application.name=attendance_management

# Datasource. Host and user fall back to local-development defaults; the
# password has no default on purpose, so a misconfigured environment fails
# at startup instead of silently trying a hardcoded one.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/attendance_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT signing key, Base64-encoded. Required — see README for how to generate one.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000000}
